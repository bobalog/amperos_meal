<style>
:root{--bg:#f5fbff;--sky:#dff4ff;--sky2:#c6eaff;--blue:#4f86a8;--ink:#34576d;--muted:#7897aa;--line:#d7ebf6;--white:#fff;--yellow:#fff5cf}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:linear-gradient(145deg,#fff,#eef9ff);min-height:100vh}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 70px}.hero{text-align:center;padding:28px 10px 20px}.hero .star{font-size:23px;letter-spacing:8px;color:#76b7d9}.hero h1{margin:8px 0 5px;font:900 clamp(35px,6vw,58px)/1.05 inherit;letter-spacing:-2px;color:#4f83a3}.hero p{margin:12px 0;color:#82a4b8;font-weight:650}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:sticky;top:8px;z-index:20;margin:12px 0 26px}.tab{border:1px solid var(--line);background:#fffffff2;color:#5c8198;border-radius:999px;padding:11px 17px;font:700 14px inherit;cursor:pointer;box-shadow:0 5px 16px #4b86a315}.tab.active{background:linear-gradient(135deg,var(--sky),var(--sky2));color:#3f7393}.panel{display:none}.panel.active{display:block}
.today,.card,.photoCard{background:#fffffff0;border:1px solid var(--line);box-shadow:0 12px 34px #477d9913}.today{border-radius:28px;padding:24px}.todaytop{display:flex;justify-content:space-between;align-items:center}.badge{display:inline-block;background:var(--sky);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}.today h2{margin:9px 0 0}.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}.meal{border-radius:19px;padding:16px;line-height:1.65}.bf{background:#fff9e5}.dn{background:#eaf7ff}.meal b{display:block;margin-bottom:6px}.items{margin:0;padding-left:19px}.jp{font-size:12px;color:var(--muted);margin-top:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.dow{text-align:center;font-size:12px;font-weight:800;color:#7fa2b7;padding:5px}.day{min-height:155px;background:#ffffffe6;border:1px solid var(--line);border-radius:20px;padding:12px;position:relative}.day.has{cursor:pointer;transition:.18s}.day.has:hover{transform:translateY(-3px);box-shadow:0 10px 25px #477d991f}.day.todaycal{outline:3px solid #8dd4fb}.num{font-size:18px;font-weight:900;color:#4f83a3}.mini{font-size:11px;line-height:1.45;margin-top:8px;padding:7px;border-radius:11px}.mini.bf{background:#fff9e8}.mini.dn{background:#edf8ff}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:11px}
.list{display:grid;gap:12px}.card{border-radius:22px;padding:17px}.card h3{margin:0 0 12px;color:#4f83a3}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photoCard{border-radius:26px;padding:14px;text-align:center}.photoCard img{width:100%;height:auto;display:block;border-radius:18px}
.modal{display:none;position:fixed;inset:0;background:#35576c66;backdrop-filter:blur(7px);z-index:99;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{position:relative;width:min(92vw,500px);max-height:88vh;overflow:auto;background:#fafdff;border:2px solid #fff;border-radius:28px;padding:27px;box-shadow:0 20px 70px #274b6147}.modalbox h2{text-align:center;color:#4f83a3}.close{position:absolute;right:12px;top:11px;border:0;background:var(--sky);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:21px;color:#4c7893}
.footer{text-align:center;margin-top:32px;font-weight:800;color:#5f8ca7}
@media(max-width:760px){.hero h1{font-size:38px}.calendar{grid-template-columns:repeat(2,1fr)}.dow{display:none}.mealgrid,.twocol{grid-template-columns:1fr}.day{min-height:135px}.wrap{padding-left:13px;padding-right:13px}}

const weekdays=["일","월","화","수","목","금","토"];
const findMenu=d=>menus.find(m=>m.day===d);
const ul=a=>`<ul class="items">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
function mealBlock(m){
 return `<div class="mealgrid">
 <div class="meal bf"><b>🌅 아침</b>${ul(m.ko.breakfast)}<div class="jp">JP · ${m.jp.breakfast.join(" / ")}</div></div>
 <div class="meal dn"><b>🌙 저녁</b>${ul(m.ko.dinner)}<div class="jp">JP · ${m.jp.dinner.join(" / ")}</div></div>
 </div>`;
}
function renderToday(){
 const now=new Date(),d=now.getDate(),isTarget=now.getFullYear()===2026&&now.getMonth()===9,m=isTarget?findMenu(d):null;
 const title=isTarget?`10월 ${d}일 (${weekdays[now.getDay()]})`:"2026년 10월 식단";
 document.querySelector("#todayBox").innerHTML=`<div class="todaytop"><div><span class="badge">TODAY</span><h2>${title}</h2></div><div style="font-size:36px">🍚</div></div>`+
 (m?mealBlock(m):`<div class="meal dn" style="margin-top:17px">${isTarget&&d>16?"17일 이후 식단은 아직 원본표에 없습니다.":"달력에서 10월 1일~16일 식단을 확인해 주세요."}</div>`);
}
function renderCalendar(){
 const cal=document.querySelector("#calendarGrid");
 ["일","월","화","수","목","금","토"].forEach(x=>cal.insertAdjacentHTML("beforeend",`<div class="dow">${x}</div>`));
 for(let i=0;i<new Date(2026,9,1).getDay();i++)cal.insertAdjacentHTML("beforeend","<div></div>");
 const now=new Date();
 for(let d=1;d<=31;d++){
   const m=findMenu(d),today=now.getFullYear()===2026&&now.getMonth()===9&&now.getDate()===d;
   const preview=m?`<div class="mini bf">🌅 ${m.ko.breakfast.join(" · ")}</div><div class="mini dn">🌙 ${m.ko.dinner.join(" · ")}</div>`:`<div class="note">${d>16?"후반 식단 미등록":"식단 없음"}</div>`;
   cal.insertAdjacentHTML("beforeend",`<div class="day ${m?"has":""} ${today?"todaycal":""}" ${m?`data-day="${d}"`:""}><div class="num">${d}${m?" ✦":""}</div>${preview}</div>`);
 }
 document.querySelectorAll(".day.has").forEach(x=>x.addEventListener("click",()=>openMeal(Number(x.dataset.day))));
}
function renderList(){
 document.querySelector("#mealList").innerHTML=menus.map(m=>`<article class="card"><h3>10월 ${m.day}일 (${weekdays[new Date(2026,9,m.day).getDay()]})</h3>${mealBlock(m)}</article>`).join("");
}
function openMeal(d){
 const m=findMenu(d); if(!m)return;
 document.querySelector("#modalTitle").textContent=`10월 ${d}일 (${weekdays[new Date(2026,9,d).getDay()]})`;
 document.querySelector("#modalBody").innerHTML=mealBlock(m);
 document.querySelector("#modal").classList.add("show");
}
document.querySelector("#close").onclick=()=>document.querySelector("#modal").classList.remove("show");
document.querySelector("#modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector("#modal").classList.remove("show")});
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");document.querySelector("#"+btn.dataset.tab).classList.add("active");
}));
renderToday();renderCalendar();renderList();
</script>

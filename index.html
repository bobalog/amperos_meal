<style>
:root{
  --ink:#52677f;
  --blue:#dff3ff;
  --blue2:#ccecff;
  --blue3:#edf9ff;
  --lav:#e9eaff;
  --cream:#fff9dc;
  --line:#d5eaf5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:var(--ink);
  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at 15% 12%, #ffffff 0 3px, transparent 4px),
    radial-gradient(circle at 83% 20%, #ccecff 0 3px, transparent 4px),
    radial-gradient(circle at 40% 70%, #e5f6ff 0 4px, transparent 5px),
    linear-gradient(145deg,#fafdff,#edf8ff);

  min-height:100vh;
}

.wrap{
  max-width:1080px;
  margin:auto;
  padding:28px 18px 70px;
}


/* =========================
   HEADER
========================= */

.hero{
  text-align:center;
  padding:35px 10px 24px;
}

.hero .spark{
  font-size:25px;
  letter-spacing:8px;
  color:#79bce3;
  margin-bottom:12px;
}

.hero h1{
  margin:8px 0;

  /* 깨짐 방지를 위해 일반 폰트 사용 */
  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    Arial,
    sans-serif;

  font-size:clamp(34px,6vw,58px);
  font-weight:900;
  letter-spacing:-2px;

  color:#5d8fb1;
}

.hero p{
  margin:12px 0 5px;
  color:#8daec3;
  font-size:16px;
  font-weight:600;
}


/* =========================
   TAB MENU
========================= */

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;

  position:sticky;
  top:8px;
  z-index:20;

  margin:12px 0 28px;
}

button{
  font:inherit;
  color:#63839a;

  border:1px solid #d5eaf5;

  background:rgba(255,255,255,.88);

  border-radius:999px;

  padding:11px 18px;

  cursor:pointer;

  box-shadow:
    0 5px 16px rgba(95,150,185,.10);

  transition:.18s ease;
}

button:hover{
  transform:translateY(-2px);
  background:#f3fbff;
}

button.active{
  background:linear-gradient(
    135deg,
    #d9f1ff,
    #cbeaff
  );

  color:#527d9a;

  font-weight:800;

  border-color:#c4e3f5;

  box-shadow:
    0 6px 18px rgba(84,156,199,.16);
}


/* =========================
   PANEL
========================= */

.panel{
  display:none;
}

.panel.active{
  display:block;
}


/* =========================
   TODAY CARD
========================= */

.today{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.96),
      #edf9ff
    );

  border:2px solid #ffffff;

  border-radius:28px;

  padding:25px;

  box-shadow:
    0 16px 45px rgba(84,140,175,.13);

  margin-bottom:24px;
}

.todaytop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.badge{
  display:inline-block;

  background:#d8f2ff;

  color:#5b8eac;

  border-radius:999px;

  padding:7px 13px;

  font-size:12px;

  font-weight:800;
}

.today h2{
  margin:10px 0 2px;
  color:#527e9b;
}


/* =========================
   MEAL
========================= */

.mealrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.meal{
  padding:17px;
  border-radius:21px;
  line-height:1.65;
}

.meal.bf{
  background:#fff8dd;
}

.meal.dn{
  background:#e7f5ff;
}

.meal b{
  display:block;
  margin-bottom:5px;
}


/* =========================
   CALENDAR
========================= */

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.dow{
  text-align:center;
  font-size:12px;
  font-weight:800;
  color:#83a9c0;
  padding:5px;
}

.day{
  min-height:154px;

  background:rgba(255,255,255,.88);

  border:1px solid #d7ebf6;

  border-radius:21px;

  padding:12px;

  box-shadow:
    0 7px 19px rgba(70,130,170,.07);

  position:relative;
}

.day.has{
  cursor:pointer;
  transition:.18s;
}

.day.has:hover{
  transform:translateY(-3px);

  box-shadow:
    0 10px 25px rgba(70,140,180,.16);
}

.day.todaycal{
  outline:3px solid #9edcff;
  background:#f5fcff;
}

.num{
  font-size:18px;
  font-weight:800;
  color:#5784a0;
}

.mini{
  font-size:11px;
  line-height:1.45;

  margin-top:8px;

  padding:7px;

  border-radius:12px;
}

.mini.bf{
  background:#fff9e8;
}

.mini.dn{
  background:#edf8ff;
}


/* =========================
   LIST
========================= */

.list{
  display:grid;
  gap:12px;
}

.card{
  background:#ffffff;

  border:1px solid #d7ebf6;

  border-radius:22px;

  padding:17px;

  box-shadow:
    0 7px 20px rgba(74,132,170,.07);
}

.card h3{
  margin:0 0 12px;
  color:#5683a0;
}

.twocol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}


/* =========================
   ORIGINAL PHOTO
========================= */

.photoCard{
  background:#ffffff;

  border-radius:26px;

  padding:15px;

  border:1px solid #d7ebf6;

  box-shadow:
    0 12px 30px rgba(70,130,170,.12);

  text-align:center;
}

.photoCard img{
  width:100%;
  border-radius:18px;
  display:block;
}

.note{
  font-size:12px;
  color:#8da9bb;
  margin-top:12px;
  line-height:1.6;
}


/* =========================
   POPUP
========================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  background:rgba(74,112,140,.35);

  backdrop-filter:blur(7px);

  z-index:999;

  padding:20px;

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalbox{
  position:relative;

  width:min(92vw,480px);

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #edf9ff
    );

  border:2px solid #ffffff;

  border-radius:30px;

  padding:28px;

  box-shadow:
    0 20px 70px rgba(65,110,145,.28);

  text-align:center;
}

.modalbox h2{
  color:#5784a0;
}

.close{
  position:absolute;

  right:13px;
  top:12px;

  width:36px;
  height:36px;

  padding:0;

  background:#e7f6ff;
}

.modalmeal{
  text-align:left;

  padding:14px 16px;

  border-radius:18px;

  margin:10px 0;

  line-height:1.65;
}


/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  margin-top:30px;

  color:#8fadc0;

  font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .hero{
    padding-top:25px;
  }

  .hero h1{
    font-size:38px;
    letter-spacing:-1.5px;
  }

  .hero .spark{
    letter-spacing:4px;
  }

  .calendar{
    grid-template-columns:repeat(2,1fr);
  }

  .dow{
    display:none;
  }

  .mealrow,
  .twocol{
    grid-template-columns:1fr;
  }

  .day{
    min-height:135px;
  }
}

</style>


<!-- HEADER -->

<section class="hero">

  <div class="spark">
    ✦ ⭐ ✦
  </div>

  <h1>
    Amperos Meal Diary
  </h1>

  <p>
    アンペロス寮 · 2026년 10월 전반 식단 · ₊˚⊹♡
  </p>

</section>


<!-- TAB -->

<nav class="tabs">

  <button
    class="tab active"
    data-tab="home">
    ☁️ 오늘의 식단
  </button>

  <button
    class="tab"
    data-tab="calendar">
    🗓️ 월간 달력
  </button>

  <button
    class="tab"
    data-tab="list">
    🥣 식단 쭈르르
  </button>

  <button
    class="tab"
    data-tab="photo">
    📷 원본 사진
  </button>

</nav>
